# --- BAU and GHG --------------------------------------------------------------

[ghg.gwp100_ch4]
base = 27
unit = "t CO2e per t CH4"
source = "IPCC AR6 GWP100 for non-fossil methane (from memory)"

[bau.bovaer_cost]
base = 99
low = 58
high = 164
unit = "$ per cow-yr"
source = "dsm-firmenich: ~$93-105 per lactating cow-yr; ~$58-64 projected from the Dalry plant; $164 at $0.45/day contracts (The Bullvine)"

[bau.bovaer_efficacy]
base = 0.28
