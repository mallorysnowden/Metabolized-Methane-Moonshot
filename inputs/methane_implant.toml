source = "Judgment: year-long slow-release antigen is new; the vaccine itself is ArkeaBio's"
[score.feasibility]
base = 3
source = "Judgment: 12.9% in a 10-cow trial"
[score.scalability]
base = 5
source = "Judgment: rides existing implant and vaccine channels"
[score.demand]
base = 2
source = "Judgment: payer depends on credits, insetting or taxes"
[score.white_space]
