# Methane-reducing cattle implant: TEA inputs. NOAK unless noted.
# "Assumption" = judgment, not sourced.

[meta]
project = "Methane-reducing cattle implant"
boundary = "Implant manufacture, distribution and data platform to the farmer's methane cut; excludes trial costs beyond R&D opex."
functional_units = "Farmer's cost per t CO2e avoided; dairy farmer's net gain per cow-year."

# --- Product ------------------------------------------------------------------

[implant.efficacy]
base = 0.20
low = 0.10
high = 0.30
unit = "fraction of enteric methane cut, averaged over implant life"
source = "ArkeaBio targets 20%; its prototype vaccine cut methane 12.9% over 105 days (Texas A&M trial)"

[implant.duration_months]
base = 12
low = 6
high = 18
unit = "months per implant"
source = "Target. ArkeaBio aims for a vaccine effective for 6 months; slow release is this concept's breakthrough."

[implant.cogs]
base = 2.50
low = 1.50
high = 5.00
unit = "$ per dose at NOAK (antigen, release matrix, RFID tag)"
source = "Assumption. Antigen doses are milligram-scale (ArkeaBio); beef growth implants sell for ~$1-3 per calf."

[implant.capex_per_dose]
base = 1.0
low = 0.5
high = 3.0
unit = "$ per dose/yr of new manufacturing capacity"
source = "Assumption: contract manufacturing for the biologic, in-house assembly"

[implant.admin_cost]
base = 0.50
low = 0.25
high = 2.0
unit = "$ farmer labor per dose"
source = "Assumption: given at routine handling, like growth implants (~0.017 h labor per implant)"

[implant.productivity_gain]
base = 0.0
low = 0.0
high = 0.02
unit = "fraction of output value"
source = "Off in base: Bovaer trials show no consistent milk gain from redirected feed energy"

[implant.adverse_event_rate]
base = 0.0005
low = 0.0
high = 0.003
unit = "serious adverse events per head"
source = "Target to prove in trials (no data yet). ArkeaBio reported no adverse effects in its 10-cow trial."

# --- Segments -----------------------------------------------------------------

[dairy.ch4_kg]
base = 117
low = 100
high = 140
unit = "kg CH4/cow-yr enteric"
source = "IPCC 2006 Tier 1 default for Western Europe; Ireland Tier 2 = 108.8"

[dairy.addressable_head]
base = 30_000_000
unit = "dairy cows in markets that pay for methane cuts"
source = "Assumption: EU, UK, NZ and US processors with Scope 3 targets"

[dairy.max_share]
base = 0.25
low = 0.10
high = 0.40
unit = "share of addressable head at maturity"
source = "Assumption"

[dairy.ramp_years]
base = 8
unit = "yr to reach max share"
source = "Assumption"

[dairy.price]
base = 15
low = 8
high = 25
unit = "$ per cow-yr implant fee"
source = "Assumption: well below Bovaer's $93-105 per cow-yr"

[dairy.carbon_value]
base = 30
low = 15
high = 60
unit = "$/t CO2e paid for verified dairy methane cuts (credits or insetting)"
source = "Trade press: buyers paying $30-50/t for verified dairy methane credits (The Bullvine); Denmark's tax is ~$43/t effective by 2035"

[dairy.output_value]
base = 4800
unit = "$ milk revenue per cow-yr"
source = "Assumption: ~24,000 lb/cow-yr at ~$20/cwt"

[beef.ch4_kg]
base = 72
low = 55
high = 90
unit = "kg CH4/head-yr enteric"
source = "IPCC Tier 1 factor for beef cows (as used in Canadian inventory studies)"

[beef.addressable_head]
base = 100_000_000
unit = "grazing beef cattle in reachable markets"
source = "Assumption: US, Brazil, Australia, Argentina range herds; ~1.2-1.5B cattle worldwide (ArkeaBio)"

[beef.max_share]
base = 0.10
low = 0.03
high = 0.20
unit = "share of addressable head at maturity"
source = "Assumption"

[beef.ramp_years]
base = 8
unit = "yr to reach max share"
source = "Assumption"

[beef.price]
base = 4
low = 2
high = 8
unit = "$ per head-yr implant fee"
source = "Assumption: priced near growth implants, which ranchers already buy"

[beef.carbon_value]
base = 15
low = 5
high = 30
unit = "$/t CO2e"
source = "Assumption: range cattle are harder to verify than barn-fed dairy"

[beef.output_value]
base = 1500
unit = "$ value of weight gain per head-yr"
source = "Assumption"

# --- Data ---------------------------------------------------------------------

[data.enabled]
base = 1
unit = "1 = offered (dairy)"
source = "Passive RFID with temperature, read at the parlour"

[data.fee]
base = 8
low = 0
high = 20
unit = "$ per cow-yr"
source = "Assumption. Collars, tags and boluses cost ~$40-197 per cow-yr (Our Land and Water NZ); smaXtec ~EUR 60 all-in."

[data.attach]
base = 0.30
low = 0.10
high = 0.60
unit = "share of treated dairy cows on the data plan"
source = "Assumption"

[data.farmer_value]
base = 12
low = 0
high = 40
unit = "$ per cow-yr for parlour-read ID and temperature"
source = "Assumption: well below full sensor systems, which claim ~$200/cow-yr (smaXtec-funded IFCN study)"

[data.margin]
base = 0.70
unit = "gross margin on data"
source = "Assumption"

